# Single-machine Fly.io deployment with persistent local NVMe volume for SQLite WAL.
# Keep min_machines_running = 1 and max_machines = 1 (single writer).
app = "meru-mind-team"
primary_region = "nrt"

[build]
  dockerfile = "deploy/Dockerfile"

[env]
  MERU_MIND_HOME = "/var/lib/meru-mind"
  MERU_MIND_PORT = "3800"

[mounts]
  source = "meru_mind_data"
  destination = "/var/lib/meru-mind"
  initial_size = "10gb"

[http_service]
  internal_port = 3800
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/v1/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
